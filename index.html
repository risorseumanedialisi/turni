<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Turni e Presenze</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A4B8D">
<meta name="description" content="Turni, presenze, assenze e costo del personale dei centri dialisi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presenze">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --ink:#0E1D2A; --ink-soft:#546472; --bg:#F4F7F9; --brand:#2A4B8D; --line:#DBE3E9; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { box-sizing:border-box; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
         env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #app { display:block; width:100%; height:100%; border:0; background:var(--bg); }
  #stato { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:24px; text-align:center; background:var(--bg); }
  #stato[hidden] { display:none; }
  #stato img { width:72px; height:72px; }
  #stato p { margin:0; max-width:34em; line-height:1.5; color:var(--ink-soft); }
  #stato strong { color:var(--ink); font-weight:600; }
  .barra { width:120px; height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
  .barra::after { content:""; display:block; width:40%; height:100%; background:var(--brand);
    animation:scorri 1.1s ease-in-out infinite; }
  @keyframes scorri { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .barra::after { animation:none; width:100%; } }
  .azioni[hidden], .barra[hidden] { display:none; }
  .azioni { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .azioni button, .azioni a { font:inherit; font-size:15px; padding:9px 16px; border-radius:8px;
    border:1px solid var(--brand); background:var(--brand); color:#fff; text-decoration:none; cursor:pointer; }
  .azioni a { background:transparent; color:var(--brand); }
  .azioni :focus-visible { outline:3px solid #9FB4DD; outline-offset:2px; }
</style>
</head>
<body>
<iframe id="app" title="Turni e Presenze" allow="clipboard-write; fullscreen"></iframe>

<div id="stato" role="status" aria-live="polite">
  <img src="icons/icon-192.png" alt="">
  <strong id="statoTitolo">Apertura in corso</strong>
  <div class="barra" id="statoBarra"></div>
  <p id="statoTesto"></p>
  <div class="azioni" id="statoAzioni" hidden>
    <button type="button" id="btnRiprova">Riprova</button>
    <a id="lnkBrowser" href="#" target="_blank" rel="noopener">Apri nel browser</a>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var stato = document.getElementById('stato');
  var titolo = document.getElementById('statoTitolo');
  var testo = document.getElementById('statoTesto');
  var barra = document.getElementById('statoBarra');
  var azioni = document.getElementById('statoAzioni');
  var lnk = document.getElementById('lnkBrowser');
  var attesa = null;
  var corrente = '';

  function mostra(t, p, conAzioni) {
    titolo.textContent = t; testo.textContent = p || '';
    barra.hidden = !!conAzioni; azioni.hidden = !conAzioni; stato.hidden = false;
  }

  // Indirizzo di Google + gli eventuali parametri di questa pagina
  // (es. ?t=SEG-ETNEO-01 dei tag NFC) passati tali e quali.
  function indirizzo() {
    // Tollera spazi, barra finale o parametri incollati per sbaglio.
    var base = String(window.URL_APP || '').trim().split('#')[0].split('?')[0].replace(/\/+$/, '');
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(base)) return '';
    var q = location.search.replace(/^\?/, '');
    return q ? base + '?' + q : base;
  }

  function apri() {
    var url = indirizzo();
    if (!url) {
      mostra('Manca l\u2019indirizzo della web app',
        'Su GitHub apri il file config.js e incolla l\u2019indirizzo di Google che finisce con /exec.', false);
      barra.hidden = true; return;
    }
    lnk.href = url;
    if (!navigator.onLine) {
      mostra('Nessuna connessione', 'Serve internet per lavorare: i dati stanno su Google. Riprova appena c\u2019\u00e8 rete.', true);
      return;
    }
    mostra('Apertura in corso', '', false);
    clearTimeout(attesa);
    attesa = setTimeout(function () {
      mostra('L\u2019apertura ci mette pi\u00f9 del solito',
        'Puoi aspettare ancora, riprovare, oppure aprire l\u2019app direttamente nel browser.', true);
    }, 25000);
    corrente = url;
    app.setAttribute('src', url);
  }

  app.addEventListener('load', function () {
    if (!corrente || app.getAttribute('src') !== corrente) return;
    clearTimeout(attesa); stato.hidden = true;
  });
  document.getElementById('btnRiprova').addEventListener('click', function () {
    apri();
  });
  window.addEventListener('online', function () { if (!stato.hidden) apri(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  apri();
})();
</script>
</body>
</html>
